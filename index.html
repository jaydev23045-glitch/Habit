
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flow OS - Cloud Edition</title>
    
    <!-- PWA & Mobile Native Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flow OS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    
    <!-- Android Specific PWA Meta -->
    <meta name="application-name" content="Flow OS">
    <meta name="msapplication-TileColor" content="#020617">
    <meta name="msapplication-tap-highlight" content="no">

    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968263.png">
    <link rel="manifest" href="./manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed',
                        'primary-hover': '#6d28d9',
                        bgDark: '#0f172a',
                        bgDarker: '#020617',
                        cardBg: '#1e293b',
                        cardBorder: '#334155',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-in': 'slideIn 0.3s ease-out',
                        'pulse-soft': 'pulseSoft 3s infinite',
                        'neural-pulse': 'neuralPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideIn: {
                            '0%': { transform: 'translateX(100%)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.4' },
                        },
                        neuralPulse: {
                            '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                            '50%': { opacity: '0.5', transform: 'scale(0.98)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #020617; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        
        body {
            background-color: #020617;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            /* Support for mobile notch */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #root {
            height: 100%;
            width: 100%;
        }

        @keyframes floatUp {
          0% { transform: translateY(0) scale(0.8); opacity: 0; }
          20% { transform: translateY(-20px) scale(1.1); opacity: 1; }
          100% { transform: translateY(-60px) scale(1); opacity: 0; }
        }
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                overflow: visible !important;
                height: auto !important;
            }
            main {
                margin-left: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
                height: auto !important;
            }
            nav, header, aside, .fixed, button, input, select, hr {
                display: none !important;
            }
            .bg-cardBg, .bg-cardBg\/40, .bg-bgDark\/50, .bg-bgDark\/40 {
                background-color: #ffffff !important;
                border: 1px solid #cbd5e1 !important;
                color: #000000 !important;
                box-shadow: none !important;
            }
            .text-white, h1, h2, h3, h4, .text-slate-100 {
                color: #000000 !important;
            }
            .text-slate-400, .text-slate-500 {
                color: #334155 !important;
            }
            canvas {
                filter: invert(0) !important;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.50.0",
    "@supabase/supabase-js/": "https://esm.sh/@supabase/supabase-js@^2.50.0/"
  }
}
</script>
</head>
<body class="bg-bgDark text-slate-100">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered:', reg.scope))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
